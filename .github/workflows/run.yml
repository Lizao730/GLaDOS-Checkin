name: GLaDOS Auto Check-in

on:
  # 保留手动执行按钮，方便测试
  workflow_dispatch:

  # 每天北京时间 09:15 自动执行
  schedule:
    - cron: '15 9 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

concurrency:
  group: glados-auto-checkin
  cancel-in-progress: false

jobs:
  run:
    name: GLaDOS Check-in
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Show trigger information
        shell: bash
        run: |
          echo "GitHub event: ${{ github.event_name }}"
          echo "UTC time:"
          date -u
          echo "Beijing time:"
          TZ=Asia/Shanghai date

      - name: Check required secrets
        shell: bash
        env:
          GLADOS: ${{ secrets.GLADOS }}
          NOTIFY: ${{ secrets.NOTIFY }}
        run: |
          if [ -z "$GLADOS" ]; then
            echo "::error::Repository secret GLADOS is empty or not configured."
            exit 1
          fi

          echo "GLADOS secret is configured."

          if [ -z "$NOTIFY" ]; then
            echo "NOTIFY is not configured. Notification may be skipped."
          else
            echo "NOTIFY secret is configured."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run GLaDOS check-in
        env:
          GLADOS: ${{ secrets.GLADOS }}
          NOTIFY: ${{ secrets.NOTIFY }}
        run: npm run main
